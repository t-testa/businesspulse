name: businesspulse-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: businesspulse
      POSTGRES_USER: businesspulse
      # Disposable local credentials, never reuse on Render.
      POSTGRES_PASSWORD: local-synthetic-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businesspulse -d businesspulse"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
