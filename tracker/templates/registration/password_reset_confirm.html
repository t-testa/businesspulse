{% extends 'tracker/base.html' %}
{% block content %}<div class="auth-wrapper"><section class="panel auth-card"><h1>Choose a new password</h1>{% if validlink %}<form method="post" class="stacked-form">{% csrf_token %}{{ form.as_p }}<button class="button primary" type="submit">Reset password</button></form>{% else %}<p>This reset link is invalid, expired, or already used.</p><a href="{% url 'password_reset' %}">Request a new link</a>{% endif %}<p><a href="{% url 'login' %}">Sign in</a></p></section></div>{% endblock %}
